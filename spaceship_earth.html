<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship Earth</title>
    <!-- Importazione del font Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Reset dei margini di default */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Impostazioni dello sfondo e della struttura centrale */
        body {
            font-family: 'Montserrat', sans-serif;
            background-image: url('bg.png'); /* Cerca il file bg.png nella stessa cartella */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Contenitore centrale */
        .landing-container {
            text-align: center;
            padding: 20px;
        }

        /* Titolo del Blog */
        h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        /* Menu di navigazione */
        nav {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        /* Stile dei bottoni del menu */
        nav a {
            text-decoration: none;
            color: #ffffff;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 12px 28px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }

        /* Effetto al passaggio del mouse sui bottoni */
        nav a:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        /* Adattamento per dispositivi mobili */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.2rem;
            }

            nav {
                flex-direction: column;
                gap: 12px;
            }

            nav a {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <h1>Voyager's Cosmos</h1>
        <nav>
            <a href="intro.html">Intro</a>
            <a href="projects.html">Projects</a>
            <a href="about.html">About</a>
        </nav>
    </div>

</body>
</html>
