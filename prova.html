<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro - Voyager's Cosmos</title>
    <!-- Importazione del font Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Reset di base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Impostazioni del corpo della pagina e dello sfondo */
        body {
            font-family: 'Montserrat', sans-serif;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Intestazione in alto con titolo e menu */
        header {
            width: 100%;
            text-align: center;
            padding: 40px 20px 20px 20px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* Stile del Menu */
        nav {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        nav a {
            text-decoration: none;
            color: #ffffff;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 20px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        /* Effetto hover e stato attivo */
        nav a:hover, nav a.active {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Contenitore principale per centrare la scheda */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 40px 20px;
        }

        /* La scheda nera centrale */
        .content-card {
            background-color: #000000;
            width: 50vw; /* Larga il 50% della risoluzione dello schermo */
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            text-align: left;
        }

        .content-card h2 {
            font-size: 1.8rem;
            line-height: 1.4;
            margin-bottom: 15px;
            font-weight: 400;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .content-card p {
            font-size: 1rem;
            line-height: 1.6;
            color: #dddddd;
            margin-bottom: 25px;
        }

        /* Contenitore mascherato per il video YouTube */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden; /* Nasconde tutto ciò che sporge dal rettangolo */
            border-radius: 6px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        /* Mascheramento del 5% superiore del video */
        .video-container iframe {
            position: absolute;
            width: 100%;
            height: 105.26%; /* Compensazione altezza per riempire il fondo */
            top: -5.26%;     /* Sposta il video in alto mascherando il 5% superiore */
            left: 0;
            border: 0;
        }

        /* Adattamento per dispositivi mobili */
        @media (max-width: 900px) {
            .content-card {
                width: 80vw;
                padding: 30px;
            }
        }

        @media (max-width: 600px) {
            .content-card {
                width: 95vw;
                padding: 20px;
            }
            nav {
                flex-direction: column;
                gap: 10px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Voyager's Cosmos</h1>
        <nav>
            <a href="intro.html" class="active">Intro</a>
            <a href="projects.html">Projects</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <div class="content-card">
            <h2>Introduction</h2>
            <p>Benvenuti su Voyager's Cosmos. Guarda il video qui sotto per scoprire una panoramica del progetto e della visione spaziale.</p>
            
            <!-- Contenitore Video YouTube -->
            <div class="video-container">
                <!-- Sostituisci ID_DEL_VIDEO con l'ID del tuo video YouTube -->
                <iframe 
                    src="https://www.youtube.com/embed/OmrTcJAPpMI" 
                    title="YouTube video player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </main>

</body>
</html>
