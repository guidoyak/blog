<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship Earth</title>
    <!-- Importazione del font Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Reset di base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Impostazioni del corpo della pagina e dello sfondo */
        body {
            font-family: 'Montserrat', sans-serif;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Intestazione in alto con titolo e menu */
        header {
            width: 100%;
            text-align: center;
            padding: 40px 20px 20px 20px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* Stile del Menu */
        nav {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        nav a {
            text-decoration: none;
            color: #ffffff;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 20px;
            border: 1px solid #ffffff;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        /* Effetto hover e stato attivo */
        nav a:hover, nav a.active {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Contenitore principale per centrare la scheda */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 40px 20px;
        }

        /* La scheda nera centrale */
        .content-card {
            background-color: #000000;
            width: 50vw; /* Larga il 50% dello schermo */
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            text-align: left;
        }

        /* Stile per la citazione introduttiva */
        .intro-quote {
            text-align: center;
            font-style: italic;
            font-size: 1.2rem; /* Dimensione ridotta */
            font-weight: 300;
            color: #ffffff;
            line-height: 1.5;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* Contenitore responsivo per il video */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Proporzione 16:9 */
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #111111;
            border-radius: 6px;
            border: 1px solid #333333;
        }

        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Adattamento Responsive */
        @media (max-width: 900px) {
            .content-card {
                width: 80vw;
                padding: 30px;
            }
        }

        @media (max-width: 600px) {
            .content-card {
                width: 95vw;
                padding: 20px;
            }
            .intro-quote {
                font-size: 1rem;
            }
            nav {
                flex-direction: column;
                gap: 10px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Spaceship Earth</h1>
        <nav>
            <a href="intro.html" class="active">Intro</a>
            <a href="projects.html">Projects</a>
            <a href="stories.html">Stories</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <div class="content-card">
            
            <!-- Titolo centrato in corsivo -->
            <h2 class="intro-quote">We are alien astronauts in a journey across the galaxy and the universe</h2>

            <!-- Contenitore Video -->
            <div class="video-container">
                <!-- Sostituisci questo iframe con il codice del tuo video originale -->
                <iframe src="https://www.youtube.com/embed/OmrTcJAPpMI" title="Video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>

        </div>
    </main>

</body>
</html>
